name: promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable YYYY.MM.github-run-number tag
        required: true
        type: string

permissions:
  contents: write
  packages: read
  attestations: read

env:
  IMAGE: ghcr.io/hbmartin/podcast-backend

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RENDER_HOOKS: ${{ secrets.RENDER_DEPLOY_HOOK_URLS }}
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Validate requested version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]'
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: resolve
        env:
          VERSION: ${{ inputs.version }}
        run: echo "digest=$(crane digest "${IMAGE}:${VERSION}")" >> "$GITHUB_OUTPUT"
      - name: Verify signature, provenance, and SPDX SBOM
        env:
          DIGEST: ${{ steps.resolve.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container.yml@refs/heads/main"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "${IMAGE}@${DIGEST}"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" --cert-identity "$identity" --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY" --cert-identity "$identity" --predicate-type https://spdx.dev/Document
      - name: Require at least one configured live provider
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RENDER_HOOKS: ${{ secrets.RENDER_DEPLOY_HOOK_URLS }}
        run: '[[ -n "$RAILWAY_TOKEN" || -n "$RENDER_HOOKS" ]]'
      - name: Pin Render Blueprint
        env:
          DIGEST: ${{ steps.resolve.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          scripts/set-image-digest.sh "$DIGEST"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add render.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Pin Render image ${VERSION}"
            git push origin HEAD:main
          fi
      - name: Deploy configured Railway services
        if: ${{ env.RAILWAY_TOKEN != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_IDS: ${{ secrets.RAILWAY_SERVICE_IDS }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: scripts/railway-deploy-image.sh "${IMAGE}@${DIGEST}" "$VERSION"
      - name: Trigger configured Render services
        if: ${{ env.RENDER_HOOKS != '' }}
        env:
          HOOKS: ${{ env.RENDER_HOOKS }}
        run: |
          while IFS= read -r hook; do
            [[ -z "$hook" ]] || curl --fail-with-body --silent --show-error --request POST "$hook"
          done < <(tr ',' '\n' <<<"$HOOKS")

  template-approval:
    needs: verify-and-deploy
    runs-on: ubuntu-latest
    environment: railway-template-approval
    steps:
      - env:
          DIGEST: ${{ needs.verify-and-deploy.outputs.digest }}
        run: echo "Confirmed canonical Railway template was repinned to ${DIGEST}"

  release:
    needs: [verify-and-deploy, template-approval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ needs.verify-and-deploy.outputs.digest }}
        run: gh release create "$VERSION" --target main --title "$VERSION" --notes "Promoted ${IMAGE}@${DIGEST}"
