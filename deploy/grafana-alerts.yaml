apiVersion: 1
groups:
  - orgId: 1
    name: podcast-backend-starter-alerts
    folder: Podcast Backend
    interval: 1m
    rules:
      - uid: podcast-http-5xx
        title: Sustained backend HTTP 5xx
        condition: C
        for: 10m
        data:
          - refId: C
            datasourceUid: prometheus
            model:
              expr: sum(rate(podcast_backend_http_request_duration_seconds_count{status=~"5.."}[5m])) > 0
              instant: true
      - uid: podcast-readiness
        title: Three consecutive readiness failures
        condition: C
        for: 0s
        data:
          - refId: C
            datasourceUid: prometheus
            model:
              expr: increase(podcast_backend_readiness_checks_total{outcome="failed"}[5m]) >= 3
              instant: true
      - uid: podcast-worker-heartbeat
        title: Worker heartbeat absent for five minutes
        condition: C
        for: 1m
        data:
          - refId: C
            datasourceUid: prometheus
            model:
              expr: time() - podcast_backend_role_heartbeat_unixtime{role="worker"} > 300
              instant: true
      - uid: podcast-queue-age
        title: Queue age exceeds ten minutes
        condition: C
        for: 5m
        data:
          - refId: C
            datasourceUid: prometheus
            model:
              expr: podcast_backend_queue_oldest_task_age_seconds > 600
              instant: true
      - uid: podcast-refresh-overdue
        title: Refresh scheduling overdue
        condition: C
        for: 5m
        data:
          - refId: C
            datasourceUid: prometheus
            model:
              expr: time() - podcast_backend_scheduler_last_success_unixtime{scheduler="refresh"} > 900
              instant: true
      - uid: podcast-digest-overdue
        title: Weekly digest scheduling overdue
        condition: C
        for: 5m
        data:
          - refId: C
            datasourceUid: prometheus
            model:
              expr: (day_of_week() == 0 and hour() >= 18) and (time() - podcast_backend_scheduler_last_success_unixtime{scheduler="digest"} > 604800)
              instant: true
